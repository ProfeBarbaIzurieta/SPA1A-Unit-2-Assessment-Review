 {id:'lectura2',title:'Las reglas de la familia Ortega',desc:'Una familia anfitriona y una rutina compartida.',text:`¡Hola! Soy Simón. Esta semana estoy con una familia anfitriona en Querétaro. Vivo con la señora Ortega, su esposo Raúl y sus hijos, Inés y Mateo. Su apartamento es moderno y luminoso. Mi habitación es pequeña, pero está ordenada. Hay una cama, un armario y una lámpara encima de la mesa.\n\nAquí todos tenemos responsabilidades. La señora Ortega trabaja mucho y cocina cuatro días por semana. Raúl cocina los otros días y siempre lava los platos después de la cena. Inés tiene que sacar la basura tres veces por semana y poner la lavadora los sábados. Mateo tiene que hacer la cama todos los días, pero casi nunca lo hace sin ayuda.\n\nYo ayudo a poner la mesa y saco a pasear al perro dos veces por semana. Los viernes, toda la familia ordena la sala. Me parece una buena idea porque nadie tiene que hacer todo. Después de los quehaceres, normalmente miramos una película juntos.`,questions:[

function renderQuizQuestion(s){const q=s.items[s.pos],r=s.response;const percent=Math.round((s.pos)/s.items.length*100);const feedback=r?`<div class="feedback ${r.right?'':'bad'}" role="status"><b>${r.right?'✓ ¡Correcto!':'↻ Sigue practicando'}</b><div>${esc(q.why)}</div>${r.right?'':`<div class="spaced"><b>Respuesta correcta: ${esc(q.t==='fill'?q.a[0]:q.a)}</b></div>`}</div>`:'';
 const mcChoices=q.t==='fill'?`<form id="fill-form" class="answer-row"><input id="typed-response" class="answer-field" autocomplete="off" autocapitalize="none" spellcheck="false" ${r?'disabled':''} placeholder="Escribe la respuesta…" value="${esc(r?.value||'')}" required aria-label="Tu respuesta"/><button class="btn teal" type="submit" ${r?'disabled':''}>Comprobar</button></form>`:`<div class="options">${q.opts.map((option,i)=>`<button class="option ${r?((option===q.a)?'correct ':'')+((r.value===option)?r.right?'selected correct':'selected incorrect':''):''}" data-action="answer-option" data-index="${i}" ${r?'disabled':''}><strong>${q.t==='mc'&&q.opts.length===2?['C','F'][i]:String.fromCharCode(65+i)}</strong><span>${esc(option)}</span></button>`).join('')}</div>`;
 return `<div class="quiz-head"><span class="tag">${esc(q.topic)}</span><span class="counter">${s.pos+1} de ${s.items.length}</span></div><div class="quiz-progress"><span style="width:${percent}%"></span></div><div class="card question-card"><div class="eyebrow">PREGUNTA ${s.pos+1}</div><h3>${esc(q.p)}</h3>${mcChoices}${feedback}<div class="quiz-actions"><span class="counter">Aciertos: ${s.score}</span>${r?`<button class="btn teal" data-action="quiz-next">${s.pos===s.items.length-1?'Ver resultado ↗':'Siguiente pregunta →'}</button>`:`<span class="help-line">${q.t==='fill'?'Escribe y comprueba':'Elige una respuesta'}</span>`}</div></div>`}
function renderQuizResult(s){const pct=Math.round(100*s.score/s.items.length);let missed=s.misses.length?`<div class="review-items">${s.misses.map(({q,value})=>`<div class="review-item"><b>${esc(q.p)}</b><div>Tu respuesta: ${esc(value||'Sin respuesta')}</div><div>Respuesta: <strong>${esc(q.t==='fill'?q.a[0]:q.a)}</strong></div><div class="tiny muted">${esc(q.why)}</div></div>`).join('')}</div>`:'<p class="muted spaced">¡No hubo respuestas incorrectas en esta ronda!</p>';
 return `<div class="card"><div class="end-state"><div class="result-circle">${pct}%</div><h2>${getLevel(pct)}</h2><p class="muted spaced">Has acertado <b>${s.score} de ${s.items.length}</b> preguntas. Los errores te indican qué conviene practicar después.</p><div class="flash-actions spaced"><button class="btn teal" data-action="quiz-restart">Otra ronda ↻</button>${s.misses.length?'<button class="btn ghost" data-action="quiz-misses">Repetir mis errores</button>':''}<button class="btn ghost" data-action="quiz-exit">Volver a la estación</button></div></div>${s.misses.length?`<hr class="rule"><h3>Lo que puedes mejorar</h3>${missed}`:''}</div>`}
function restartQuiz(){if(!session)return;const s=session;let pool;if(s.origin==='reto')return launchFinal();if(s.context?.type==='reading')pool=READINGS[s.context.idx].questions;else if(s.context?.type==='listening')pool=LISTENINGS[s.context.idx].questions;else pool=(s.sourcePool||s.items);startQuiz(s.label,pool,s.origin,s.context,s.items.length)}
function wrongQuestions(){const items=Object.values(Q).flat().filter(x=>saved.answers[x.id]?.lastCorrect===false);if(!items.length){toast('¡No hay errores pendientes! Prueba un reto nuevo.');return}startQuiz('Mis preguntas para repasar',items,'inicio',null,Math.min(items.length,20))}
function openModal(kind){let isReset=kind==='reset';$('#modal-root').innerHTML=`<div class="modal-overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${isReset?'¿Borrar tu progreso?':'Cómo usar Casa Abierta'}</h2>${isReset?'<p>Esto borra tus preguntas practicadas, tarjetas marcadas y borradores de escritura de este navegador. Esta acción no se puede deshacer.</p>':'<p>Escoge una estación, responde, lee las explicaciones y vuelve a probar. La sección de escucha usa la voz en español disponible en tu navegador. El avance y la escritura permanecen en este dispositivo cuando el almacenamiento local está permitido.</p><p>Es un repaso independiente, sin cuenta y sin respuestas del examen. No sustituye la corrección de tu profesor/a.</p>'}<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Cerrar</button>${isReset?'<button class="btn primary" data-action="confirm-reset">Sí, borrar todo</button>':'<button class="btn ghost" data-action="modal-to-reset">Restablecer mi progreso</button>'}</div></div></div>`}
function handleClick(e){const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navTo(nav.dataset.nav);return}
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;switch(action){
 case'launch-vocab':return startQuiz('Vocabulario · 16 preguntas',Q.vocab,'palabras',null,16);
 case'launch-house':return startQuiz('La casa · 12 preguntas',Q.casa,'casa',null,12);
 case'launch-grammar':return startQuiz('Gramática · 18 preguntas',Q.gramatica,'gramatica',null,18);
 case'grammar-topic':return startQuiz(b.dataset.topic,Q.gramatica.filter(x=>x.topic===b.dataset.topic),'gramatica');
 case'launch-reading':return startQuiz('Lectura '+(readingIdx+1),READINGS[readingIdx].questions,'lectura',{type:'reading',idx:readingIdx});
 case'launch-listening':return startQuiz('Escucha '+(listeningIdx+1),LISTENINGS[listeningIdx].questions,'escucha',{type:'listening',idx:listeningIdx});
 case'launch-final':return launchFinal();
 case'wrong':return wrongQuestions();
 case'flash-flip':cardsState.flip=!cardsState.flip;return updateFlash();
 case'flash-prev':cardsState.pos=Math.max(0,cardsState.pos-1);cardsState.flip=false;return updateFlash();
 case'flash-next':cardsState.pos=Math.min(matchingCards().length-1,cardsState.pos+1);cardsState.flip=false;return updateFlash();
 case'flash-random':cardsState.pos=Math.floor(Math.random()*matchingCards().length);cardsState.flip=false;return updateFlash();
 case'flash-reverse':cardsState.reverse=!cardsState.reverse;cardsState.flip=false;return updateFlash();
 case'flash-known':{const c=matchingCards()[cardsState.pos];if(!c)return;saved.cards[c.id]=!saved.cards[c.id];persist();return updateFlash()}
 case'reading-switch':readingIdx=Number(b.dataset.index);return renderReading();
 case'listening-switch':listeningIdx=Number(b.dataset.index);transcriptOpen=false;stopAudio();return renderListening();
 case'play-audio':return playListening(Number(b.dataset.index));
 case'stop-audio':return stopAudio();
 case'toggle-transcript':transcriptOpen=!transcriptOpen;return page==='quiz'?renderQuiz():renderListening();
 case'answer-option':if(!session)return;return recordQuizAnswer(session.items[session.pos].opts[Number(b.dataset.index)]);
 case'quiz-next':if(!session||session.response===null)return;session.pos++;session.response=null;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});return;
 case'quiz-exit':return navTo(session?.origin||'inicio');
 case'quiz-restart':return restartQuiz();
 case'quiz-misses':{const s=session;return startQuiz('Repetir los errores',s.misses.map(e=>e.q),s.origin,s.context)}
 case'speaker-start':return runSpeakerTimer();
 case'speaker-model':speaker.model=!speaker.model;return renderSpeaking();
 case'speaker-next':stopTimer();speaker.pos++;speaker.model=false;speaker.started=false;speaker.remaining=30;saved.speaking++;persist();return renderSpeaking();
 case'speaking-restart':stopTimer();speaker={items:shuffle(SPEAKING).slice(0,6),pos:0,model:false,remaining:30,timer:null,started:false};return renderSpeaking();
 case'write-switch':writingIdx=Number(b.dataset.index);return renderWriting();
 case'copy-draft':{const text=saved.drafts[writingIdx]||'';if(!text.trim()){toast('Escribe un borrador primero.');return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Texto copiado.'),()=>toast('No fue posible copiar automáticamente.'))}else{const field=$('#writing-text');field.select();try{document.execCommand('copy');toast('Texto copiado.')}catch{toast('Selecciona y copia tu texto manualmente.')}}return}
 case'clear-draft':if(!confirm('¿Borrar el borrador de esta actividad?'))return;saved.drafts[writingIdx]='';saved.checks[writingIdx]={};persist();return renderWriting();
 case'modal-close':$('#modal-root').innerHTML='';return;
 case'modal-to-reset':return openModal('reset');
 case'confirm-reset':saved={answers:{},cards:{},drafts:['',''],checks:[{},{}],speaking:0};persist();$('#modal-root').innerHTML='';return navTo('inicio');
 default:return;
 }}
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{if(e.target.id==='fill-form'){e.preventDefault();const v=$('#typed-response')?.value||'';if(v.trim())recordQuizAnswer(v)}});
document.addEventListener('change',e=>{if(e.target.id==='flash-group'){cardsState.group=e.target.value;cardsState.pos=0;cardsState.flip=false;updateFlash()}if(e.target.id==='audio-speed')voiceSpeed=Number(e.target.value);if(e.target.classList.contains('writing-check')){let i=Number(e.target.dataset.index);if(!saved.checks[writingIdx])saved.checks[writingIdx]={};saved.checks[writingIdx][i]=e.target.checked;persist()}});
document.addEventListener('input',e=>{if(e.target.id==='flash-search'){cardsState.query=e.target.value;cardsState.pos=0;cardsState.flip=false;updateFlash()}if(e.target.id==='writing-text'){saved.drafts[writingIdx]=e.target.value;persist();updateWordCount()}});
document.addEventListener('keydown',e=>{if(page==='palabras'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){if(e.key==='ArrowLeft'){cardsState.pos=Math.max(0,cardsState.pos-1);cardsState.flip=false;updateFlash()}else if(e.key==='ArrowRight'){cardsState.pos=Math.min(matchingCards().length-1,cardsState.pos+1);cardsState.flip=false;updateFlash()}}if(e.key==='Escape'&&$('#modal-root').childNodes.length){$('#modal-root').innerHTML=''}});
$('#help-btn').addEventListener('click',()=>openModal('help'));
window.addEventListener('beforeunload',()=>{stopAudio();stopTimer()});
render();

</script>
</body>
</html>
